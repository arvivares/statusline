name: Website

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "branding/**"
      - "scripts/generate-brand-assets.mjs"
      - ".github/workflows/website.yml"
      - ".github/dependabot.yml"
      - "scripts/website-ci.mjs"
      - "scripts/website-ci.test.mjs"
      - ".editorconfig"
      - ".node-version"

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  changes:
    name: Detect website scope
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.scope.outputs.should_run }}

    steps:
      - name: Check out repository and pull request history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Test scope detection and required check policy
        run: node --test scripts/website-ci.test.mjs

      - name: Detect relevant changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: node scripts/website-ci.mjs scope

  validate:
    name: TypeScript, formatting and production build
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install website dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run check

      - name: Check formatting
        run: npm run format:check

      - name: Build production website
        run: npm run build

      - name: Validate generated SEO artifacts
        run: npm run test:seo

  required:
    # Require this stable check, not the conditional build job, in main's ruleset.
    name: Website validation
    needs: [changes, validate]
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enforce website validation result
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          SHOULD_RUN: ${{ needs.changes.outputs.should_run }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: node scripts/website-ci.mjs gate
