name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24"
  RUST_VERSION: "1.98.0"
  STATUSLINE_RELAY_BASE_URL: ${{ vars.STATUSLINE_RELAY_BASE_URL }}

jobs:
  validate:
    name: Release preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse Unix release scripts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n StatuslineDesktop/scripts/smoke-installers-linux.sh
          bash -n StatuslineDesktop/scripts/smoke-installer-macos.sh

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            StatuslineDesktop/package-lock.json
            StatuslineRelay/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: StatuslineDesktop

      - name: Install relay dependencies
        run: npm ci
        working-directory: StatuslineRelay

      - name: Validate universal relay service
        run: npm run db:migrate:local && npm test && npm run check
        working-directory: StatuslineRelay

      - name: Install pinned Rust formatter
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component rustfmt
          rustup default ${{ env.RUST_VERSION }}

      - name: Validate release metadata and frontend
        run: npm run release:check
        working-directory: StatuslineDesktop

      - name: Check Rust formatting
        run: cargo fmt --manifest-path StatuslineDesktop/src-tauri/Cargo.toml --all -- --check

      - name: Read release metadata
        id: metadata
        shell: bash
        run: |
          version=$(node -p "require('./StatuslineDesktop/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate universal relay endpoint
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$STATUSLINE_RELAY_BASE_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo "Set the STATUSLINE_RELAY_BASE_URL repository variable to the public HTTPS relay origin." >&2
            exit 1
          fi

      - name: Require signing credentials for tagged releases
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$WINDOWS_CERTIFICATE" || -z "$WINDOWS_CERTIFICATE_PASSWORD" || -z "$WINDOWS_TIMESTAMP_URL" ]]; then
            echo "Tagged desktop releases require the Windows signing configuration." >&2
            exit 1
          fi

  installers:
    name: ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      IS_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v') }}
      STATUSLINE_VERSION: ${{ needs.validate.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            build_args: --ci --bundles nsis,msi
          - name: Linux x64
            runner: ubuntu-22.04
            build_args: --ci --bundles deb,rpm,appimage
          - name: macOS universal
            runner: macos-latest
            build_args: --ci --target universal-apple-darwin --bundles dmg

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse Windows release scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $scripts = Get-ChildItem "StatuslineDesktop/scripts" -Filter "*.ps1" -File
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PowerShell parse failure in $($script.Name): $($errors[0].Message)"
            }
          }

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: StatuslineDesktop/package-lock.json

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
          rustup default ${{ env.RUST_VERSION }}

      - name: Add universal macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            dbus-x11 \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            wget \
            xvfb \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci
        working-directory: StatuslineDesktop

      - name: Prepare Windows Authenticode signing
        id: signing
        if: runner.os == 'Windows' && env.IS_RELEASE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: ./scripts/prepare-windows-signing.ps1
        working-directory: StatuslineDesktop

      - name: Build native installers
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: StatuslineDesktop
          args: ${{ matrix.build_args }} ${{ steps.signing.outputs.args }}
          tagName: ${{ env.IS_RELEASE == 'true' && github.ref_name || '' }}
          releaseName: ${{ env.IS_RELEASE == 'true' && 'Statusline Companion v__VERSION__' || '' }}
          releaseBody: ${{ env.IS_RELEASE == 'true' && 'Beta de Statusline Companion para Windows, Linux y macOS. Verifica los instaladores con SHA256SUMS.txt antes de usarlos.' || '' }}
          releaseDraft: ${{ env.IS_RELEASE == 'true' }}
          generateReleaseNotes: ${{ env.IS_RELEASE == 'true' }}
          retryAttempts: 0
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: statusline-[version]-[platform]-[arch]-[bundle]

      - name: Diagnose WiX linker failure
        if: failure() && runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $buildPath = Resolve-Path "StatuslineDesktop/src-tauri/target/release/wix/x64"
          $wixPath = Join-Path $env:LOCALAPPDATA "tauri/WixTools314"
          $light = Join-Path $wixPath "light.exe"
          if (-not (Test-Path -LiteralPath $light -PathType Leaf)) {
            throw "WiX light.exe was not found at $light"
          }
          Push-Location $buildPath
          try {
            & $light `
              -ext (Join-Path $wixPath "WixUIExtension.dll") `
              -ext (Join-Path $wixPath "WixUtilExtension.dll") `
              -o "diagnostic-output.msi" `
              "-cultures:es-es;en-US" `
              -loc "locale.wxl" `
              "*.wixobj"
            exit $LASTEXITCODE
          }
          finally {
            Pop-Location
          }

      - name: Verify Windows Authenticode signatures
        if: runner.os == 'Windows' && env.IS_RELEASE == 'true'
        shell: pwsh
        run: |
          $files = @(
            Get-Item "StatuslineDesktop/src-tauri/target/release/statusline-desktop.exe"
            Get-ChildItem "StatuslineDesktop/src-tauri/target/release/bundle" -Recurse -File -Include *.exe,*.msi
          )
          if ($files.Count -lt 3) {
            throw "Expected the application, NSIS installer and MSI for signature verification."
          }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature on $($file.Name): $($signature.Status)"
            }
          }

      - name: Smoke test Windows install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-installers-windows.ps1 -BundleRoot ./src-tauri/target/release/bundle
        working-directory: StatuslineDesktop

      - name: Smoke test Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./scripts/smoke-installers-linux.sh ./src-tauri/target/release/bundle
        working-directory: StatuslineDesktop

      - name: Smoke test macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: bash ./scripts/smoke-installer-macos.sh ./src-tauri/target/universal-apple-darwin/release/bundle
        working-directory: StatuslineDesktop

      - name: Remove temporary Windows signing material
        if: always() && runner.os == 'Windows' && env.IS_RELEASE == 'true'
        shell: pwsh
        run: >-
          ./scripts/cleanup-windows-signing.ps1
          -Thumbprint '${{ steps.signing.outputs.thumbprint }}'
          -PfxPath '${{ steps.signing.outputs.pfx-path }}'
          -ConfigPath '${{ steps.signing.outputs.config-path }}'
        working-directory: StatuslineDesktop

  checksums:
    name: Release checksums
    needs: [validate, installers]
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download installer artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: statusline-${{ needs.validate.outputs.version }}-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 manifest
        run: node StatuslineDesktop/scripts/generate-checksums.mjs release-assets SHA256SUMS.txt

      - name: Upload checksum artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: statusline-${{ needs.validate.outputs.version }}-checksums
          path: SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          archive: false

      - name: Attach checksums to draft release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber
