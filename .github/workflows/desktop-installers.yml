name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24"
  RUST_VERSION: "1.98.0"

jobs:
  validate:
    name: Release preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: StatuslineDesktop/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: StatuslineDesktop

      - name: Install pinned Rust formatter
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component rustfmt
          rustup default ${{ env.RUST_VERSION }}

      - name: Validate release metadata and frontend
        run: npm run release:check
        working-directory: StatuslineDesktop

      - name: Check Rust formatting
        run: cargo fmt --manifest-path StatuslineDesktop/src-tauri/Cargo.toml --all -- --check

  installers:
    name: ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      IS_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            bundles: nsis,msi
          - name: Linux x64
            runner: ubuntu-22.04
            bundles: deb,rpm,appimage

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: StatuslineDesktop/package-lock.json

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
          rustup default ${{ env.RUST_VERSION }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            wget \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci
        working-directory: StatuslineDesktop

      - name: Build native installers
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: StatuslineDesktop
          args: --ci --bundles ${{ matrix.bundles }}
          tagName: ${{ env.IS_RELEASE == 'true' && github.ref_name || '' }}
          releaseName: ${{ env.IS_RELEASE == 'true' && 'Statusline Companion v__VERSION__' || '' }}
          releaseBody: ${{ env.IS_RELEASE == 'true' && 'Instaladores nativos de Statusline Companion para Windows y Linux.' || '' }}
          releaseDraft: ${{ env.IS_RELEASE == 'true' }}
          generateReleaseNotes: ${{ env.IS_RELEASE == 'true' }}
          retryAttempts: 1
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: statusline-[version]-[platform]-[arch]-[bundle]
