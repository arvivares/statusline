name: Repository quality

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - "apps/android/**"
      - "apps/apple/**"
      - "content/**"
      - "apps/desktop/**"
      - "branding/**"
      - "docs/**"
      - "localization/**"
      - "packaging/**"
      - "protocol/**"
      - "release.json"
      - "scripts/**"
      - "services/relay/**"
      - "*.md"
      - ".editorconfig"
      - ".gitignore"
      - ".node-version"
      - "rust-toolchain.toml"

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  RUST_VERSION: "1.98.0"

jobs:
  native-companion:
    name: Companion typecheck (${{ matrix.os }})
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop
      - name: Test the macOS updater architecture guard without compiling installers
        if: runner.os == 'macOS'
        run: npm test -- scripts/verify-macos-architectures.test.mjs
        working-directory: apps/desktop
      - name: Install Linux typecheck dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Check native companion without producing installers or signing
        run: cargo +1.98.0 check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

  codex-runtime:
    name: Codex runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path apps/desktop/runtime-tests/Cargo.toml --all -- --check
      - name: Test production Codex modules without a CLI, credentials or WebView
        run: cargo test --manifest-path apps/desktop/runtime-tests/Cargo.toml --locked

      - name: Test Windows desktop package query with fixture metadata
        if: runner.os == 'Windows'
        shell: powershell
        run: "& ./apps/desktop/scripts/test-codex-desktop-discovery.ps1"

      - name: Test Windows Installer argument encoding
        if: runner.os == 'Windows'
        shell: pwsh
        run: "& ./apps/desktop/scripts/test-windows-msi-arguments.ps1"

      - name: Test Apple bundle configuration guard without compiling iOS
        if: runner.os == 'macOS'
        run: node --test apps/apple/scripts/validate-relay-bundle.test.mjs

  validate:
    name: Docs, frontend, relay and release policy
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            branding/package-lock.json
            services/relay/package-lock.json

      - name: Install desktop dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Install relay dependencies
        run: npm ci
        working-directory: services/relay

      - name: Install brand asset tooling
        run: npm ci
        working-directory: branding

      - name: Validate official brand assets
        run: npm run check
        working-directory: branding

      - name: Validate App Store download QR
        run: node scripts/generate-download-qr.mjs --check

      - name: Validate documentation and desktop release policy
        # Release signature fixtures use the same pinned Rust verifier as CI.
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
          rustup default "$RUST_VERSION"

      - name: Check documentation and desktop release policy
        run: npm run release:check
        working-directory: apps/desktop

      - name: Validate relay
        run: npm run db:migrate:local && npm test && npm run check
        working-directory: services/relay

      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check

      - name: Check maintained shell scripts
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends shellcheck
          fi
          find apps/desktop/scripts apps/apple/scripts -type f -name '*.sh' -print0 \
            | xargs -0 shellcheck --severity=warning

      - name: Parse maintained PowerShell scripts
        shell: pwsh
        run: |
          $scripts = Get-ChildItem "apps/desktop/scripts" -Filter "*.ps1" -File
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PowerShell parse failure in $($script.Name): $($errors[0].Message)"
            }
          }
