name: Revalidate desktop installers

on:
  workflow_dispatch:
    inputs:
      artifacts_run_id:
        description: Workflow run ID containing installer artifacts
        required: true
        type: string
      platform:
        description: Installer platform to validate
        required: true
        default: windows
        type: choice
        options:
          - windows
          - linux
          - macos
          - all

permissions:
  actions: read
  contents: read

jobs:
  windows:
    name: Windows installer smoke
    if: inputs.platform == 'windows' || inputs.platform == 'all'
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out validation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse PowerShell release scripts
        shell: pwsh
        run: |
          $scripts = Get-ChildItem "StatuslineDesktop/scripts" -Filter "*.ps1" -File
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PowerShell parse failure in $($script.Name): $($errors[0].Message)"
            }
          }

      - name: Download Windows installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: statusline-*-windows-x64-*
          path: downloaded-installers
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.artifacts_run_id }}

      - name: Smoke test Windows installers
        shell: pwsh
        run: ./scripts/smoke-installers-windows.ps1 -BundleRoot ../downloaded-installers
        working-directory: StatuslineDesktop

  linux:
    name: Linux installer smoke
    if: inputs.platform == 'linux' || inputs.platform == 'all'
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out validation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse Linux release scripts
        shell: bash
        run: bash -n StatuslineDesktop/scripts/smoke-installers-linux.sh

      - name: Install Linux smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dbus-x11 \
            file \
            libfuse2 \
            rpm \
            xvfb

      - name: Download Linux installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: statusline-*-linux-*
          path: downloaded-installers
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.artifacts_run_id }}

      - name: Smoke test Linux installers
        shell: bash
        run: bash ./scripts/smoke-installers-linux.sh ../downloaded-installers
        working-directory: StatuslineDesktop

  macos:
    name: macOS installer smoke
    if: inputs.platform == 'macos' || inputs.platform == 'all'
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Check out validation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse macOS release script
        shell: bash
        run: bash -n StatuslineDesktop/scripts/smoke-installer-macos.sh

      - name: Download macOS installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: statusline-*-darwin-universal-dmg
          path: downloaded-installers
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.artifacts_run_id }}

      - name: Smoke test macOS DMG
        shell: bash
        run: bash ./scripts/smoke-installer-macos.sh ../downloaded-installers
        working-directory: StatuslineDesktop
