name: Revalidate desktop installers

on:
  workflow_dispatch:
    inputs:
      artifacts_run_id:
        description: Workflow run ID containing installer artifacts
        required: true
        type: string
      platform:
        description: Installer platform to validate
        required: true
        default: windows
        type: choice
        options:
          - windows
          - linux
          - macos
          - all
      require_macos_trust:
        description: Require Developer ID, notarization and Gatekeeper acceptance
        required: true
        default: true
        type: boolean
      require_linux_signatures:
        description: Require valid OpenPGP signatures on all Linux installers
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  windows:
    name: Windows installer smoke
    if: inputs.platform == 'windows' || inputs.platform == 'all'
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out validation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse PowerShell release scripts
        shell: pwsh
        run: |
          $scripts = Get-ChildItem "apps/desktop/scripts" -Filter "*.ps1" -File
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PowerShell parse failure in $($script.Name): $($errors[0].Message)"
            }
          }

      - name: Download Windows installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: statusline-*-windows-x64-*
          path: downloaded-installers
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.artifacts_run_id }}

      - name: Smoke test Windows installers
        shell: pwsh
        run: ./scripts/smoke-installers-windows.ps1 -BundleRoot ../../downloaded-installers
        working-directory: apps/desktop

  linux:
    name: Linux installer smoke
    if: inputs.platform == 'linux' || inputs.platform == 'all'
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out validation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse Linux release scripts
        shell: bash
        run: |
          bash -n apps/desktop/scripts/smoke-installers-linux.sh
          bash -n apps/desktop/scripts/verify-linux-signatures.sh

      - name: Install Linux smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dbus-x11 \
            file \
            libfuse2 \
            gnupg \
            rpm \
            xvfb

      - name: Download Linux installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: statusline-*-linux-*
          path: downloaded-installers
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.artifacts_run_id }}

      - name: Smoke test Linux installers
        shell: bash
        run: bash ./scripts/smoke-installers-linux.sh ../../downloaded-installers
        working-directory: apps/desktop

      - name: Verify Linux OpenPGP signatures
        if: inputs.require_linux_signatures
        shell: bash
        run: >-
          bash ./scripts/verify-linux-signatures.sh
          ../../downloaded-installers
          ../../packaging/linux/statusline-release-signing-key.asc
        working-directory: apps/desktop

  macos:
    name: macOS installer smoke
    if: inputs.platform == 'macos' || inputs.platform == 'all'
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Check out validation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse macOS release script
        shell: bash
        run: bash -n apps/desktop/scripts/smoke-installer-macos.sh

      - name: Download macOS installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: statusline-*-darwin-universal-*
          path: downloaded-installers
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.artifacts_run_id }}

      - name: Smoke test macOS DMG and PKG
        shell: bash
        env:
          STATUSLINE_REQUIRE_MACOS_TRUST: ${{ inputs.require_macos_trust }}
        run: bash ./scripts/smoke-installer-macos.sh ../../downloaded-installers
        working-directory: apps/desktop

  checksums:
    name: Installer checksum manifest
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out checksum generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Download installer artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: statusline-*
          path: downloaded-installers
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.artifacts_run_id }}

      - name: Generate SHA-256 manifest
        run: node apps/desktop/scripts/generate-checksums.mjs downloaded-installers SHA256SUMS.txt

      - name: Upload checksum artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: statusline-${{ inputs.artifacts_run_id }}-checksums
          path: SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
