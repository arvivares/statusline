name: Android artifacts

on:
  workflow_call:
    inputs:
      release:
        description: Build the signed Android release artifacts
        required: true
        type: boolean
      release_version:
        description: Product version expected by the calling release workflow
        required: true
        type: string
    secrets:
      ANDROID_UPLOAD_KEYSTORE_BASE64:
        required: false
      ANDROID_UPLOAD_KEYSTORE_PASSWORD:
        required: false
      ANDROID_UPLOAD_KEY_ALIAS:
        required: false
      ANDROID_UPLOAD_KEY_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      release:
        description: Build signed APK and AAB release artifacts
        required: true
        default: false
        type: boolean
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android.yml"
      - "apps/android/**"
      - "protocol/**"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_PLATFORM: "android-37.0"
  JAVA_VERSION: "17"

jobs:
  changes:
    name: Detect Android scope
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.scope.outputs.should_run }}

    steps:
      - name: Check out pull request history
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect relevant changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid pull request commit metadata." >&2
            exit 1
          fi

          should_run=false
          while IFS= read -r path; do
            case "$path" in
              apps/android/* | protocol/* | .github/workflows/android.yml)
                should_run=true
                break
                ;;
            esac
          done < <(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA")

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

  validate:
    name: Tests, lint and debug APK
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;$ANDROID_PLATFORM" \
            "build-tools;$ANDROID_BUILD_TOOLS"

      - name: Test, lint and build debug APK
        shell: bash
        env:
          RELEASE_BUILD: ${{ inputs.release || false }}
          REPOSITORY_RELAY_BASE_URL: ${{ vars.STATUSLINE_RELAY_BASE_URL }}
        working-directory: apps/android
        run: |
          set -euo pipefail
          gradle_tasks=(testDebugUnitTest lintRelease)
          if [[ "$RELEASE_BUILD" != true ]]; then
            gradle_tasks+=(assembleDebug)
          fi
          relay_args=()
          if [[ -n "$REPOSITORY_RELAY_BASE_URL" ]]; then
            if [[ ! "$REPOSITORY_RELAY_BASE_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?$ ]]; then
              echo "STATUSLINE_RELAY_BASE_URL must be an HTTPS origin without a path." >&2
              exit 1
            fi
            relay_args+=("-PSTATUSLINE_RELAY_BASE_URL=$REPOSITORY_RELAY_BASE_URL")
          fi
          ./gradlew --no-daemon \
            "${gradle_tasks[@]}" \
            "${relay_args[@]}"

      - name: Upload debug APK
        if: inputs.release != true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: statusline-android-debug-${{ github.run_number }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Signed release APK and AAB
    needs: validate
    if: inputs.release == true
    runs-on: ubuntu-22.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;$ANDROID_PLATFORM" \
            "build-tools;$ANDROID_BUILD_TOOLS"

      - name: Require release configuration
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          REPOSITORY_RELAY_BASE_URL: ${{ vars.STATUSLINE_RELAY_BASE_URL }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$ANDROID_UPLOAD_KEYSTORE_BASE64" ]] || missing+=(ANDROID_UPLOAD_KEYSTORE_BASE64)
          [[ -n "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" ]] || missing+=(ANDROID_UPLOAD_KEYSTORE_PASSWORD)
          [[ -n "$ANDROID_UPLOAD_KEY_ALIAS" ]] || missing+=(ANDROID_UPLOAD_KEY_ALIAS)
          [[ -n "$ANDROID_UPLOAD_KEY_PASSWORD" ]] || missing+=(ANDROID_UPLOAD_KEY_PASSWORD)
          [[ -n "$REPOSITORY_RELAY_BASE_URL" ]] || missing+=(STATUSLINE_RELAY_BASE_URL)
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing Android release configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          if [[ ! "$REPOSITORY_RELAY_BASE_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?$ ]]; then
            echo "STATUSLINE_RELAY_BASE_URL must be an HTTPS origin without a path." >&2
            exit 1
          fi

      - name: Decode temporary upload keystore
        id: keystore
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/statusline-upload.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          [[ -s "$keystore_path" ]]
          chmod 600 "$keystore_path"
          echo "path=$keystore_path" >> "$GITHUB_OUTPUT"

      - name: Build signed release artifacts
        shell: bash
        env:
          REPOSITORY_RELAY_BASE_URL: ${{ vars.STATUSLINE_RELAY_BASE_URL }}
          STATUSLINE_ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          STATUSLINE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          STATUSLINE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          STATUSLINE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        working-directory: apps/android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            assembleRelease \
            bundleRelease \
            "-PSTATUSLINE_RELAY_BASE_URL=$REPOSITORY_RELAY_BASE_URL"

      - name: Verify and collect release artifacts
        id: release-metadata
        shell: bash
        env:
          REQUESTED_RELEASE_VERSION: ${{ inputs.release_version || '' }}
        run: |
          set -euo pipefail
          release_version=$(node -p "require('./release.json').components.android.versionName")
          if [[ -n "$REQUESTED_RELEASE_VERSION" && "$REQUESTED_RELEASE_VERSION" != "$release_version" ]]; then
            echo "Requested release version $REQUESTED_RELEASE_VERSION does not match Android $release_version." >&2
            exit 1
          fi
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          apk="apps/android/app/build/outputs/apk/release/app-release.apk"
          aab="apps/android/app/build/outputs/bundle/release/app-release.aab"
          mapping="apps/android/app/build/outputs/mapping/release/mapping.txt"
          artifact_dir="$RUNNER_TEMP/statusline-android-release"
          diagnostics_dir="$RUNNER_TEMP/statusline-android-diagnostics"

          [[ -s "$apk" && -s "$aab" && -s "$mapping" ]]
          bash apps/android/scripts/verify-r8-registrars.sh "$mapping"
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$apk"
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" \
            verify --verbose --print-certs "$apk"
          jarsigner -verify -verbose -certs "$aab"

          mkdir -p "$artifact_dir"
          mkdir -p "$diagnostics_dir"
          cp "$apk" "$artifact_dir/Statusline_${release_version}_android.apk"
          cp "$aab" "$artifact_dir/Statusline_${release_version}_android.aab"
          cp "$mapping" "$diagnostics_dir/Statusline_${release_version}_mapping.txt"
          cd "$artifact_dir"
          sha256sum \
            "Statusline_${release_version}_android.apk" \
            "Statusline_${release_version}_android.aab" \
            > ANDROID-SHA256SUMS.txt

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: statusline-${{ steps.release-metadata.outputs.version }}-android-release-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/statusline-android-release
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload private R8 mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-r8-mapping-${{ github.run_number }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/statusline-android-diagnostics
          if-no-files-found: error
          compression-level: 9
          retention-days: 30

      - name: Remove temporary upload keystore
        if: always()
        shell: bash
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/statusline-upload.jks"
          if [[ -n "$KEYSTORE_PATH" && -f "$KEYSTORE_PATH" ]]; then
            rm -f -- "$KEYSTORE_PATH"
          fi
