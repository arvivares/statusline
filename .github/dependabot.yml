version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /services/relay
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directories:
      - /apps/desktop/src-tauri
      - /apps/desktop/runtime-tests
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        update-types:
          - minor
          - patch
      runtime-major-updates:
        group-by: dependency-name
        update-types:
          - major

  - package-ecosystem: npm
    directory: /branding
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    # Keep tested dependency lines during the API-24 Play-protection hotfix.
    # Reassess deferred majors separately with widget/push QA; security alerts stay on.
    ignore:
      - dependency-name: "androidx.work:work-runtime"
        versions: [">=2.12.0"]
      - dependency-name: "com.google.firebase:firebase-bom"
        versions: [">=35.0.0"]
    groups:
      compatible-updates:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
