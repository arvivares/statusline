[package]
name = "statusline-desktop"
version = "0.1.1"
description = "The cross-platform Statusline companion for Codex usage"
authors = ["Statusline contributors"]
edition = "2024"
rust-version = "1.98"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "statusline_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-positioner = { version = "=2.3.3", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.4.3"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["io-util", "process", "sync", "time"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
