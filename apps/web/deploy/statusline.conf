server {
    listen 80;
    listen [::]:80;
    server_name statusline.inmerzion.io www.statusline.inmerzion.io;
    server_tokens off;

    access_log /var/log/nginx/statusline.inmerzion.access.log inmerzion_session;
    error_log /var/log/nginx/statusline.inmerzion.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://statusline.inmerzion.io$request_uri;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.statusline.inmerzion.io;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/statusline.inmerzion.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/statusline.inmerzion.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/statusline.inmerzion.access.log inmerzion_session;
    error_log /var/log/nginx/statusline.inmerzion.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://statusline.inmerzion.io$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name statusline.inmerzion.io;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/statusline.inmerzion.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/statusline.inmerzion.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:StatuslineSSL:1m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/statusline.inmerzion.access.log inmerzion_session;
    error_log /var/log/nginx/statusline.inmerzion.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://plausible.inmerzion.io/js/pa-I8pQQow2mmhcCJBQvq-7n.js; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src https://plausible.inmerzion.io/api/event; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;

    resolver 127.0.0.11 valid=30s ipv6=off;
    location / {
        set $statusline_upstream http://statusline-web:80;
        proxy_pass $statusline_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
