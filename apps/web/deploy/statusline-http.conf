# Initial HTTP configuration used only to provision the dedicated certificate.
server {
    listen 80;
    listen [::]:80;
    server_name statusline.inmerzion.io www.statusline.inmerzion.io;
    server_tokens off;

    access_log /var/log/nginx/statusline.inmerzion.access.log inmerzion_session;
    error_log /var/log/nginx/statusline.inmerzion.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
        try_files $uri =404;
    }

    resolver 127.0.0.11 valid=30s ipv6=off;
    location / {
        set $statusline_upstream http://statusline-web:80;
        proxy_pass $statusline_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
