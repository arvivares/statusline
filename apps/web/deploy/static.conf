server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    # Keep redirects relative: TLS is terminated by the public reverse proxy.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css text/plain text/javascript application/javascript application/json application/xml image/svg+xml font/ttf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /es {
        return 301 /es/$is_args$args;
    }

    location /es/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
        error_page 404 /es/404.html;
    }

    location = /404.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* ^/assets/.*-[a-zA-Z0-9_-]+\.(css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.ttf$ {
        default_type font/ttf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ~* \.(woff2?|png|svg)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
