<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Statusline — social preview (ES)</title>
    <link rel="stylesheet" href="social-card.css" />
  </head>
  <body>
    <div class="card">
      <header>
        <div class="brand">
          <img
            src="../../public/assets/statusline-symbol.svg"
            alt=""
          />statusline.
        </div>
        <div class="tag">MANTÉN EL CONTROL</div>
      </header>
      <div class="eyebrow">MENOS SORPRESAS. MÁS FLOW.</div>
      <h1>Tu cuota.<br /><span>A la vista.</span></h1>
      <div class="orbit"></div>
      <div class="meter">
        <div class="readout">
          <small>CUOTA DISPONIBLE</small>
          <div class="number">73<span>%</span></div>
          <p>LISTO PARA CREAR</p>
        </div>
        <div class="ticks"></div>
      </div>
      <footer>
        <div>CODEX · ESCRITORIO · MÓVIL · WIDGETS</div>
        <div class="domain">statusline.inmerzion.io ↗</div>
      </footer>
    </div>
  </body>
</html>
