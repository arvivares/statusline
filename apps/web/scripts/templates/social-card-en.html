<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Statusline — social preview (EN)</title>
    <link rel="stylesheet" href="social-card.css" />
  </head>
  <body>
    <div class="card">
      <header>
        <div class="brand">
          <img
            src="../../public/assets/statusline-symbol.svg"
            alt=""
          />statusline.
        </div>
        <div class="tag">STAY IN CONTROL</div>
      </header>
      <div class="eyebrow">FEWER SURPRISES. MORE FLOW.</div>
      <h1>Your quota.<br /><span>At a glance.</span></h1>
      <div class="orbit"></div>
      <div class="meter">
        <div class="readout">
          <small>QUOTA REMAINING</small>
          <div class="number">73<span>%</span></div>
          <p>READY TO CREATE</p>
        </div>
        <div class="ticks"></div>
      </div>
      <footer>
        <div>CODEX · DESKTOP · MOBILE · WIDGETS</div>
        <div class="domain">statusline.inmerzion.io ↗</div>
      </footer>
    </div>
  </body>
</html>
