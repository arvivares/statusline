[package]
name = "statusline-runtime-tests"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"

# Compile the real Codex modules without Tauri/WebView or installer dependencies.
# Keep these versions aligned with ../src-tauri/Cargo.toml.
[dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
minisign-verify = "=0.2.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
ring = "=0.17.14"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
time = { version = "=0.3.55", features = ["parsing"] }
tempfile = "=3.27.0"
uuid = { version = "=1.26.1", features = ["serde"] }
sys-locale = "=0.3.2"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "process", "rt", "time", "sync", "test-util"] }

[target.'cfg(windows)'.dependencies]
dirs = "=7.0.0"
winreg = "=0.56.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
flate2 = "=1.1.10"
tar = "=0.4.46"
