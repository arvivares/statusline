[package]
name = "statusline-runtime-tests"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"

# Compile the real Codex modules without Tauri/WebView or installer dependencies.
# Keep these versions aligned with ../src-tauri/Cargo.toml.
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sys-locale = "=0.3.2"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["io-util", "process", "rt", "time", "sync", "test-util"] }

[target.'cfg(windows)'.dependencies]
dirs = "=6.0.0"
winreg = "=0.56.0"
